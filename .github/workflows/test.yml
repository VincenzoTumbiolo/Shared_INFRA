name: Test

on:
  push:
    branches:
      - pre-dev
      - "feat**"
      - "fix**"
      - "job**"

env:
  AWS_EC2_METADATA_DISABLED: "true"
  BASE_FOLDER_NAME: shared-infra
  GIT_TERMINAL_PROMPT: 1
  PULUMI_BUCKET: vtechstudio-infrastructure-state
  PULUMI_CONFIG_PASSPHRASE: dummy

jobs:
  pulumi-sys-test:
    name: Pulumi System Test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set Environments
        run: |
          echo "${{ secrets.DEV_ENV_FILE_EU_CENTRAL_1 }}" > $GITHUB_ENV
          echo "${{ secrets.DEV_ENV_FILE_EU_CENTRAL_1 }}" >> .env

      - name: Assume role using OIDC
        uses: aws-actions/configure-aws-credentials@v1-node16
        with:
          role-to-assume: ${{ env.DEPLOYER_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEPLOY_REGION }}

      - uses: actions/setup-go@v4
        name: Setup Go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set token for Go
        env:
          GO_TOKEN: ${{ secrets.GO_TOKEN }}
        run: |
          export GOPRIVATE=github.com/amplifon-x
          cat > /home/runner/.netrc << EOF
            machine github.com login ${GO_TOKEN}
          EOF

      - name: Setup Pulumi
        uses: pulumi/actions@v4

      - name: Login to Pulumi backend
        run: pulumi login s3://${{ env.PULUMI_BUCKET }}

      - name: Select or create stack - network
        run: |
          cd network
          pulumi stack select organization/${{ env.VAR_project_prefix }}_network/${{ env.VAR_env }} || pulumi stack init organization/${{ env.VAR_project_prefix }}_network/${{ env.VAR_env }}
          pulumi stack --show-urns

      - name: Pulumi preview - network
        run: |
          cd network
          pulumi refresh --yes
          pulumi --stack organization/${{ env.VAR_project_prefix }}_network/${{ env.VAR_env }} preview
          pulumi stack --show-urns

      - name: Get Pulumi Output - Network Infrastructure - Default for Tests
        id: pulumi_outputs
        run: |
          echo "SHARED_VPC_ID=$DEFAULT_VPC_TEST" >> $GITHUB_ENV
          echo "PRIVATE_SUBNETS=$DEFAULT_SUBNET_TEST" >> $GITHUB_ENV

      - name: Select or create stack - load_balancer
        run: |
          cd load_balancer
          pulumi stack select organization/${{ env.VAR_project_prefix }}_load_balancer/${{ env.VAR_env }} || pulumi stack init organization/${{ env.VAR_project_prefix }}_load_balancer/${{ env.VAR_env }}
          pulumi stack --show-urns

      - name: Pulumi preview - load_balancer
        run: |
          cd load_balancer
          pulumi refresh --yes
          pulumi --stack organization/${{ env.VAR_project_prefix }}_load_balancer/${{ env.VAR_env }} preview
          pulumi stack --show-urns
